[project]
name = "chart-gallery"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.2",
    "sqlglot==30.23.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
